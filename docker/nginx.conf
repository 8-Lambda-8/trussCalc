server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;

    location = / {
        return 302 /truss/;
    }

    location = /truss {
        return 301 /truss/;
    }

    location /truss/assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /truss/ {
        try_files $uri $uri/ /truss/index.html;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
